<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="evPrize" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#evPrize)" />
  <rect x="20" y="20" width="560" height="360" rx="16" fill="#FFFFFF" stroke="#B45309" stroke-width="2" />

  <g transform="translate(300, 140)">
    <!-- Trophy Silhouette -->
    <path d="M -35 -30 C -35 20 -10 40 0 40 C 10 40 35 20 35 -30 Z" fill="#F59E0B" stroke="#B45309" stroke-width="2" />
    <path d="M -35 -20 C -55 -20 -50 10 -30 15" fill="none" stroke="#D97706" stroke-width="4" stroke-linecap="round" />
    <path d="M 35 -20 C 55 -20 50 10 30 15" fill="none" stroke="#D97706" stroke-width="4" stroke-linecap="round" />
    <rect x="-6" y="40" width="12" height="25" fill="#F59E0B" />
    <polygon points="-25,65 25,65 30,80 -30,80" fill="#78350F" />
  </g>

  <text x="300" y="260" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#B45309" text-anchor="middle">Annual Prize Distribution</text>
  <text x="300" y="290" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#166534" text-anchor="middle">Honoring Academic &amp; Extracurricular Excellence</text>
  <text x="300" y="320" font-family="system-ui, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Annual Gathering of Parents, Students &amp; Faculty</text>
</svg>
