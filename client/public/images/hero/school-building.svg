<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="60%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>
    <linearGradient id="lawnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="1200" height="700" fill="url(#skyGrad)" />

  <!-- Soft Clouds -->
  <ellipse cx="220" cy="110" rx="90" ry="32" fill="#FFFFFF" opacity="0.8" />
  <ellipse cx="280" cy="95" rx="70" ry="28" fill="#FFFFFF" opacity="0.9" />
  <ellipse cx="880" cy="130" rx="110" ry="36" fill="#FFFFFF" opacity="0.8" />
  <ellipse cx="960" cy="115" rx="80" ry="30" fill="#FFFFFF" opacity="0.9" />

  <!-- Distant Trees & Greenery -->
  <path d="M 0 520 Q 150 490 300 515 Q 500 480 750 510 Q 1000 485 1200 520 L 1200 700 L 0 700 Z" fill="#BBF7D0" opacity="0.7" />
  <path d="M 0 535 Q 220 510 450 530 Q 700 505 950 528 Q 1100 515 1200 535 L 1200 700 L 0 700 Z" fill="#86EFAC" opacity="0.8" />

  <!-- Main School Building Complex -->
  <!-- Left Wing -->
  <rect x="180" y="270" width="220" height="250" fill="url(#wallGrad)" stroke="#CBD5E1" stroke-width="2" rx="4" />
  <!-- Left Wing Roof Cornice -->
  <rect x="170" y="255" width="240" height="18" fill="url(#roofGrad)" rx="2" />
  <!-- Left Wing Windows -->
  <g fill="#38BDF8" stroke="#1E293B" stroke-width="1.5">
    <rect x="205" y="290" width="45" height="50" rx="3" />
    <rect x="275" y="290" width="45" height="50" rx="3" />
    <rect x="340" y="290" width="45" height="50" rx="3" />
    <rect x="205" y="365" width="45" height="50" rx="3" />
    <rect x="275" y="365" width="45" height="50" rx="3" />
    <rect x="340" y="365" width="45" height="50" rx="3" />
    <rect x="205" y="440" width="45" height="50" rx="3" />
    <rect x="275" y="440" width="45" height="50" rx="3" />
    <rect x="340" y="440" width="45" height="50" rx="3" />
  </g>

  <!-- Right Wing -->
  <rect x="800" y="270" width="220" height="250" fill="url(#wallGrad)" stroke="#CBD5E1" stroke-width="2" rx="4" />
  <!-- Right Wing Roof Cornice -->
  <rect x="790" y="255" width="240" height="18" fill="url(#roofGrad)" rx="2" />
  <!-- Right Wing Windows -->
  <g fill="#38BDF8" stroke="#1E293B" stroke-width="1.5">
    <rect x="825" y="290" width="45" height="50" rx="3" />
    <rect x="895" y="290" width="45" height="50" rx="3" />
    <rect x="960" y="290" width="45" height="50" rx="3" />
    <rect x="825" y="365" width="45" height="50" rx="3" />
    <rect x="895" y="365" width="45" height="50" rx="3" />
    <rect x="960" y="365" width="45" height="50" rx="3" />
    <rect x="825" y="440" width="45" height="50" rx="3" />
    <rect x="895" y="440" width="45" height="50" rx="3" />
    <rect x="960" y="440" width="45" height="50" rx="3" />
  </g>

  <!-- Central Academic Wing (Elevated) -->
  <rect x="380" y="210" width="440" height="310" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" rx="6" />
  <!-- Central Header Facade in Heritage Green -->
  <rect x="365" y="195" width="470" height="35" fill="url(#roofGrad)" rx="4" />
  <!-- Arch Pediment -->
  <polygon points="360,195 600,120 840,195" fill="#166534" stroke="#B45309" stroke-width="2" />

  <!-- School Name Plaque on Building -->
  <rect x="440" y="235" width="320" height="40" fill="#F8FAFC" stroke="#166534" stroke-width="2" rx="4" />
  <text x="600" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="900" 
        text-anchor="middle" fill="#166534" letter-spacing="1.5">MADNI PUBLIC SCHOOL</text>
  <text x="600" y="284" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" 
        text-anchor="middle" fill="#1D4ED8" letter-spacing="1">CAMPUS BUILDING • CLASSES 1 TO 8</text>

  <!-- Central Clock / Emblem Tower -->
  <circle cx="600" cy="165" r="22" fill="#FFFFFF" stroke="#B45309" stroke-width="3" />
  <!-- Clock Hands pointing to 8:00 (School Start) -->
  <line x1="600" y1="165" x2="600" y2="150" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />
  <line x1="600" y1="165" x2="588" y2="172" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />

  <!-- Flagpole with Pakistan Flag -->
  <line x1="600" y1="120" x2="600" y2="40" stroke="#94A3B8" stroke-width="3" />
  <polygon points="600,42 660,52 660,78 600,68" fill="#166534" stroke="#FFFFFF" stroke-width="1" />
  <rect x="600" y="42" width="16" height="26" fill="#FFFFFF" />
  <circle cx="636" cy="60" r="7" fill="#FFFFFF" />
  <circle cx="638" cy="59" r="6" fill="#166534" />
  <polygon points="642,56 644,60 648,60 645,63 646,67 642,64 638,67 640,63 637,60 641,60" fill="#FFFFFF" />

  <!-- Central Building Pillars -->
  <g fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5">
    <rect x="450" y="300" width="22" height="150" rx="3" />
    <rect x="520" y="300" width="22" height="150" rx="3" />
    <rect x="658" y="300" width="22" height="150" rx="3" />
    <rect x="728" y="300" width="22" height="150" rx="3" />
  </g>

  <!-- Central Entrance Steps & Grand Doors -->
  <polygon points="520,520 680,520 700,560 500,560" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1" />
  <rect x="555" y="380" width="90" height="140" fill="#1D4ED8" rx="8" stroke="#1E40AF" stroke-width="3" />
  <line x1="600" y1="380" x2="600" y2="520" stroke="#FFFFFF" stroke-width="2" />
  <!-- Door Handles -->
  <circle cx="590" cy="460" r="3.5" fill="#FCD34D" />
  <circle cx="610" cy="460" r="3.5" fill="#FCD34D" />

  <!-- Front Courtyard / Paved Pathway -->
  <polygon points="500,560 700,560 840,700 360,700" fill="#CBD5E1" />

  <!-- Lush Green Lawns on Sides -->
  <polygon points="0,540 380,540 360,700 0,700" fill="url(#lawnGrad)" />
  <polygon points="820,540 1200,540 1200,700 840,700" fill="url(#lawnGrad)" />

  <!-- Trees along border -->
  <g fill="#15803D" stroke="#166534" stroke-width="2">
    <!-- Left Tree 1 -->
    <rect x="90" y="470" width="20" height="80" fill="#78350F" stroke="#451A03" />
    <circle cx="100" cy="450" r="50" />
    <circle cx="80" cy="420" r="40" />
    <circle cx="120" cy="420" r="40" />
    <!-- Right Tree 1 -->
    <rect x="1090" y="470" width="20" height="80" fill="#78350F" stroke="#451A03" />
    <circle cx="1100" cy="450" r="50" />
    <circle cx="1080" cy="420" r="40" />
    <circle cx="1120" cy="420" r="40" />
  </g>

  <!-- Institutional Watermark Banner Badge -->
  <g transform="translate(40, 40)">
    <rect width="320" height="60" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#166534" stroke-width="2" />
    <circle cx="34" cy="30" r="18" fill="#166534" />
    <text x="34" y="35" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#FCD34D" text-anchor="middle">23</text>
    <text x="64" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#166534">23 YEARS OF EXCELLENCE</text>
    <text x="64" y="45" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Established 2001 • D.I. Khan, KPK</text>
  </g>
</svg>
