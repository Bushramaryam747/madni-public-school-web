<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="100%" stop-color="#0f4422" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="94" fill="#FFFFFF" stroke="#166534" stroke-width="5" />
  <circle cx="100" cy="100" r="87" fill="#F8FAFC" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="4 2" />

  <!-- Shield Base -->
  <path d="M 100 28 C 138 28 160 40 160 75 C 160 120 100 165 100 165 C 100 165 40 120 40 75 C 40 40 62 28 100 28 Z" 
        fill="url(#shieldGrad)" stroke="#B45309" stroke-width="2.5" />

  <!-- Radiance Rays -->
  <g stroke="#FDE047" stroke-width="1.5" opacity="0.6">
    <line x1="100" y1="42" x2="100" y2="52" />
    <line x1="82" y1="46" x2="89" y2="54" />
    <line x1="118" y1="46" x2="111" y2="54" />
    <line x1="72" y1="58" x2="81" y2="63" />
    <line x1="128" y1="58" x2="119" y2="63" />
  </g>

  <!-- Torch of Wisdom -->
  <path d="M 97 50 Q 100 42 103 50 Q 106 58 100 62 Q 94 58 97 50 Z" fill="#F59E0B" />
  <path d="M 99 53 Q 100 48 101 53 Q 102 57 100 59 Q 98 57 99 53 Z" fill="#FEF08A" />
  <path d="M 96 62 L 104 62 L 102 74 L 98 74 Z" fill="#E2E8F0" stroke="#B45309" stroke-width="1" />

  <!-- Open Book of Knowledge -->
  <g transform="translate(100, 95)">
    <!-- Book Left Page -->
    <path d="M 0 6 C -15 -4 -32 -3 -42 4 L -42 28 C -32 21 -15 20 0 30 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
    <!-- Book Right Page -->
    <path d="M 0 6 C 15 -4 32 -3 42 4 L 42 28 C 32 21 15 20 0 30 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
    <!-- Book Spine -->
    <line x1="0" y1="6" x2="0" y2="30" stroke="#B45309" stroke-width="2" />
    <!-- Page Lines Left -->
    <line x1="-36" y1="11" x2="-8" y2="8" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="-36" y1="16" x2="-8" y2="13" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="-36" y1="21" x2="-8" y2="18" stroke="#94A3B8" stroke-width="1.5" />
    <!-- Page Lines Right -->
    <line x1="8" y1="8" x2="36" y2="11" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="8" y1="13" x2="36" y2="16" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="8" y1="18" x2="36" y2="21" stroke="#94A3B8" stroke-width="1.5" />
  </g>

  <!-- Stars -->
  <polygon points="68,75 70,80 75,80 71,83 73,88 68,85 63,88 65,83 61,80 66,80" fill="#FCD34D" />
  <polygon points="132,75 134,80 139,80 135,83 137,88 132,85 127,88 129,83 125,80 130,80" fill="#FCD34D" />

  <!-- Lower Banner Ribbon -->
  <path d="M 22 152 L 40 142 L 160 142 L 178 152 L 166 166 L 152 158 L 48 158 L 34 166 Z" 
        fill="#1D4ED8" stroke="#B45309" stroke-width="1.5" />
  <text x="100" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" 
        text-anchor="middle" fill="#FFFFFF" letter-spacing="1">MADNI PUBLIC SCHOOL</text>

  <!-- Subtext: 23 Years of Excellence -->
  <text x="100" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" 
        text-anchor="middle" fill="#166534" letter-spacing="0.5">23 YEARS OF EXCELLENCE • D.I. KHAN</text>
  <text x="100" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="600" 
        text-anchor="middle" fill="#64748B">CLASSES 1 TO 8</text>
</svg>
