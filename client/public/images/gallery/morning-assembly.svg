<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="morningSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="50%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#morningSky)" />

  <!-- School Grounds / Paved Assembly Yard -->
  <polygon points="0,260 800,260 800,500 0,500" fill="#E2E8F0" />
  <g stroke="#CBD5E1" stroke-width="2">
    <line x1="100" y1="260" x2="50" y2="500" />
    <line x1="250" y1="260" x2="200" y2="500" />
    <line x1="400" y1="260" x2="400" y2="500" />
    <line x1="550" y1="260" x2="600" y2="500" />
    <line x1="700" y1="260" x2="750" y2="500" />
  </g>

  <!-- Assembly Stage & Flag -->
  <rect x="250" y="220" width="300" height="50" fill="#166534" rx="4" />
  <!-- Flag Pole -->
  <line x1="400" y1="220" x2="400" y2="90" stroke="#64748B" stroke-width="4" />
  <polygon points="400,95 470,105 470,135 400,125" fill="#166534" />
  <rect x="400" y="95" width="18" height="30" fill="#FFFFFF" />
  <circle cx="440" cy="115" r="7" fill="#FFFFFF" />
  <circle cx="442" cy="114" r="6" fill="#166534" />
  <polygon points="446,110 448,114 452,114 449,117 450,121 446,118 442,121 444,117 441,114 445,114" fill="#FFFFFF" />

  <!-- Students Standing in Disciplined Rows -->
  <g fill="#1D4ED8" stroke="#1E40AF" stroke-width="1">
    <!-- Row 1 -->
    <circle cx="150" cy="330" r="10" fill="#F87171" />
    <rect x="142" y="340" width="16" height="35" rx="3" />
    <circle cx="210" cy="330" r="10" fill="#F87171" />
    <rect x="202" y="340" width="16" height="35" rx="3" />
    <circle cx="270" cy="330" r="10" fill="#F87171" />
    <rect x="262" y="340" width="16" height="35" rx="3" />
    <!-- Row 2 -->
    <circle cx="530" cy="330" r="10" fill="#60A5FA" />
    <rect x="522" y="340" width="16" height="35" rx="3" fill="#166534" />
    <circle cx="590" cy="330" r="10" fill="#60A5FA" />
    <rect x="582" y="340" width="16" height="35" rx="3" fill="#166534" />
    <circle cx="650" cy="330" r="10" fill="#60A5FA" />
    <rect x="642" y="340" width="16" height="35" rx="3" fill="#166534" />
    <!-- Closer Row (Bigger) -->
    <circle cx="250" cy="410" r="14" fill="#FCA5A5" />
    <rect x="238" y="424" width="24" height="50" rx="4" />
    <circle cx="350" cy="410" r="14" fill="#FCA5A5" />
    <rect x="338" y="424" width="24" height="50" rx="4" />
    <circle cx="450" cy="410" r="14" fill="#93C5FD" />
    <rect x="438" y="424" width="24" height="50" rx="4" fill="#166534" />
    <circle cx="550" cy="410" r="14" fill="#93C5FD" />
    <rect x="538" y="424" width="24" height="50" rx="4" fill="#166534" />
  </g>

  <!-- Banner Header -->
  <rect x="180" y="25" width="440" height="60" rx="10" fill="#FFFFFF" stroke="#166534" stroke-width="2" />
  <text x="400" y="52" font-family="system-ui, sans-serif" font-size="17" font-weight="bold" fill="#166534" text-anchor="middle">MORNING ASSEMBLY &amp; DISCIPLINE</text>
  <text x="400" y="73" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">National Anthem • Moral Reminder • Character Inculcation</text>

  <!-- Badge Overlay -->
  <rect x="30" y="30" width="90" height="36" rx="6" fill="#1D4ED8" />
  <text x="75" y="53" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">EVENTS</text>
</svg>
