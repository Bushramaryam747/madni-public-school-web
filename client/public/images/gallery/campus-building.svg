<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="skyGradC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#skyGradC)" />

  <!-- School Main Entrance & Gate -->
  <polygon points="0,340 800,340 800,500 0,500" fill="#CBD5E1" />
  
  <!-- Boundary Wall & Gate Pillars -->
  <rect x="100" y="240" width="60" height="150" fill="#F8FAFC" stroke="#64748B" stroke-width="2" rx="4" />
  <rect x="640" y="240" width="60" height="150" fill="#F8FAFC" stroke="#64748B" stroke-width="2" rx="4" />
  <polygon points="90,240 130,210 170,240" fill="#166534" />
  <polygon points="630,240 670,210 710,240" fill="#166534" />

  <!-- Entrance Arch -->
  <path d="M 160 270 Q 400 130 640 270" stroke="#166534" stroke-width="24" fill="none" />
  <path d="M 160 270 Q 400 130 640 270" stroke="#FCD34D" stroke-width="4" fill="none" />
  <text x="400" y="215" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#166534" text-anchor="middle">MADNI PUBLIC SCHOOL</text>
  <text x="400" y="240" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1D4ED8" text-anchor="middle">MADNI TOWN, NEAR SHAH ALAM ABAD, D.I. KHAN</text>

  <!-- Campus Building in Background -->
  <rect x="200" y="160" width="400" height="180" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" />
  <!-- Windows -->
  <g fill="#38BDF8">
    <rect x="240" y="180" width="30" height="35" rx="2" />
    <rect x="290" y="180" width="30" height="35" rx="2" />
    <rect x="480" y="180" width="30" height="35" rx="2" />
    <rect x="530" y="180" width="30" height="35" rx="2" />
  </g>

  <!-- Iron Gate Grills -->
  <g stroke="#1E293B" stroke-width="2">
    <line x1="160" y1="300" x2="390" y2="300" />
    <line x1="160" y1="330" x2="390" y2="330" />
    <line x1="160" y1="360" x2="390" y2="360" />
    <line x1="410" y1="300" x2="640" y2="300" />
    <line x1="410" y1="330" x2="640" y2="330" />
    <line x1="410" y1="360" x2="640" y2="360" />
  </g>

  <!-- Green Grass Borders -->
  <polygon points="0,380 120,380 100,500 0,500" fill="#15803D" />
  <polygon points="680,380 800,380 800,500 700,500" fill="#15803D" />

  <!-- Badge Overlay -->
  <rect x="30" y="30" width="160" height="36" rx="6" fill="#166534" />
  <text x="110" y="53" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SCHOOL BUILDING</text>
</svg>
