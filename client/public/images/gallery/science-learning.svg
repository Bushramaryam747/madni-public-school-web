<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sciBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sciBg)" />
  
  <!-- Laboratory / Learning Table -->
  <polygon points="0,320 800,320 800,500 0,500" fill="#E2E8F0" />
  <rect x="60" y="300" width="680" height="150" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" />

  <!-- Scientific & Practical Apparatus -->
  <!-- Microscope -->
  <g transform="translate(180, 200)">
    <rect x="30" y="70" width="10" height="40" fill="#334155" />
    <circle cx="35" cy="50" r="14" fill="#1D4ED8" />
    <rect x="25" y="10" width="20" height="50" rx="4" fill="#475569" transform="rotate(20 35 35)" />
    <rect x="15" y="105" width="40" height="10" fill="#0F172A" />
  </g>

  <!-- Beakers and Flasks -->
  <g transform="translate(340, 230)">
    <!-- Conical Flask -->
    <polygon points="40,20 60,20 80,70 20,70" fill="#93C5FD" stroke="#1D4ED8" stroke-width="2" />
    <polygon points="28,50 72,50 80,70 20,70" fill="#3B82F6" opacity="0.6" />
    <!-- Graduated Cylinder -->
    <rect x="110" y="10" width="22" height="80" rx="2" fill="#BBF7D0" stroke="#166534" stroke-width="2" />
    <rect x="110" y="45" width="22" height="45" fill="#22C55E" opacity="0.6" />
  </g>

  <!-- Globe & Anatomy Model -->
  <g transform="translate(540, 190)">
    <circle cx="50" cy="50" r="42" fill="#60A5FA" stroke="#1E40AF" stroke-width="2" />
    <path d="M 30 35 Q 45 25 65 35 Q 75 55 55 70 Q 35 65 30 35 Z" fill="#22C55E" opacity="0.8" />
    <path d="M 50 92 L 50 115 L 20 115" stroke="#475569" stroke-width="4" fill="none" />
  </g>

  <!-- Banner text -->
  <rect x="160" y="45" width="480" height="60" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2" />
  <text x="400" y="75" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1D4ED8" text-anchor="middle">MIDDLE WING (CLASSES 6 - 8) SCIENCE &amp; MATH</text>
  <text x="400" y="94" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Practical Experiments • Critical Thinking • Logical Reasoning</text>

  <!-- Badge Overlay -->
  <rect x="30" y="30" width="110" height="36" rx="6" fill="#1D4ED8" />
  <text x="85" y="53" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">LEARNING</text>
</svg>
