<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="skySports" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#F0F9FF" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#skySports)" />

  <!-- Green Playing Field -->
  <polygon points="0,220 800,220 800,500 0,500" fill="url(#groundGrad)" />
  <!-- Running Track Lines -->
  <path d="M 0 320 C 300 300 500 300 800 320" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-dasharray="16 10" />
  <path d="M 0 390 C 300 370 500 370 800 390" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-dasharray="16 10" />
  <path d="M 0 460 C 300 440 500 440 800 460" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-dasharray="16 10" />

  <!-- Cricket Wickets & Bat (Very popular in Pakistan) -->
  <g transform="translate(180, 240)">
    <!-- 3 Stumps -->
    <rect x="0" y="30" width="6" height="70" fill="#FDE047" stroke="#B45309" stroke-width="1.5" />
    <rect x="14" y="30" width="6" height="70" fill="#FDE047" stroke="#B45309" stroke-width="1.5" />
    <rect x="28" y="30" width="6" height="70" fill="#FDE047" stroke="#B45309" stroke-width="1.5" />
    <!-- Bails -->
    <rect x="-2" y="26" width="38" height="5" fill="#F59E0B" rx="1" />
    <!-- Cricket Bat -->
    <rect x="50" y="20" width="16" height="75" rx="3" fill="#D97706" transform="rotate(25 50 20)" />
    <!-- Red Cricket Ball -->
    <circle cx="85" cy="85" r="14" fill="#DC2626" stroke="#991B1B" stroke-width="2" />
    <path d="M 77 77 Q 85 85 93 93" stroke="#FFFFFF" stroke-width="1.5" fill="none" />
  </g>

  <!-- Football / Soccer Ball -->
  <g transform="translate(560, 280)">
    <circle cx="50" cy="50" r="38" fill="#FFFFFF" stroke="#0F172A" stroke-width="3" />
    <!-- Pentagon in center -->
    <polygon points="50,30 65,42 60,60 40,60 35,42" fill="#0F172A" />
    <!-- Lines to edges -->
    <line x1="50" y1="30" x2="50" y2="12" stroke="#0F172A" stroke-width="2.5" />
    <line x1="65" y1="42" x2="82" y2="35" stroke="#0F172A" stroke-width="2.5" />
    <line x1="60" y1="60" x2="75" y2="76" stroke="#0F172A" stroke-width="2.5" />
    <line x1="40" y1="60" x2="25" y2="76" stroke="#0F172A" stroke-width="2.5" />
    <line x1="35" y1="42" x2="18" y2="35" stroke="#0F172A" stroke-width="2.5" />
  </g>

  <!-- Header Banner -->
  <rect x="180" y="40" width="440" height="70" rx="12" fill="#FFFFFF" stroke="#166534" stroke-width="2" />
  <text x="400" y="70" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#166534" text-anchor="middle">PHYSICAL FITNESS &amp; SPORTS ACTIVITIES</text>
  <text x="400" y="94" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Building Teamwork • Stamina • Sportsmanship • Health</text>

  <!-- Badge Overlay -->
  <rect x="30" y="30" width="100" height="36" rx="6" fill="#15803D" />
  <text x="80" y="53" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SPORTS</text>
</svg>
