<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="libBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#libBg)" />

  <!-- Wooden Bookshelves in Background -->
  <rect x="60" y="80" width="680" height="340" rx="8" fill="#78350F" stroke="#451A03" stroke-width="4" />
  <!-- Shelves -->
  <line x1="60" y1="160" x2="740" y2="160" stroke="#FDE68A" stroke-width="12" />
  <line x1="60" y1="240" x2="740" y2="240" stroke="#FDE68A" stroke-width="12" />
  <line x1="60" y1="320" x2="740" y2="320" stroke="#FDE68A" stroke-width="12" />
  <line x1="60" y1="400" x2="740" y2="400" stroke="#FDE68A" stroke-width="12" />

  <!-- Row 1 Books -->
  <g>
    <rect x="90" y="100" width="22" height="55" fill="#166534" rx="2" />
    <rect x="115" y="95" width="28" height="60" fill="#1D4ED8" rx="2" />
    <rect x="145" y="105" width="18" height="50" fill="#DC2626" rx="2" />
    <rect x="165" y="90" width="30" height="65" fill="#D97706" rx="2" />
    <rect x="220" y="98" width="24" height="57" fill="#0284C7" rx="2" />
    <rect x="246" y="92" width="26" height="63" fill="#166534" rx="2" />
    <rect x="300" y="102" width="20" height="53" fill="#9333EA" rx="2" />
    <rect x="322" y="94" width="25" height="61" fill="#EA580C" rx="2" />
    <!-- Middle span books -->
    <rect x="440" y="92" width="28" height="63" fill="#15803D" rx="2" />
    <rect x="470" y="98" width="22" height="57" fill="#1E40AF" rx="2" />
    <rect x="495" y="104" width="20" height="51" fill="#CA8A04" rx="2" />
    <rect x="580" y="94" width="32" height="61" fill="#475569" rx="2" />
    <rect x="614" y="90" width="26" height="65" fill="#B91C1C" rx="2" />
  </g>

  <!-- Row 2 Books -->
  <g>
    <rect x="90" y="180" width="30" height="55" fill="#1E3A8A" rx="2" />
    <rect x="122" y="175" width="24" height="60" fill="#15803D" rx="2" />
    <rect x="148" y="182" width="28" height="53" fill="#B45309" rx="2" />
    <rect x="260" y="175" width="25" height="60" fill="#4338CA" rx="2" />
    <rect x="287" y="180" width="30" height="55" fill="#047857" rx="2" />
    <rect x="520" y="174" width="35" height="61" fill="#7C2D12" rx="2" />
    <rect x="557" y="180" width="24" height="55" fill="#0369A1" rx="2" />
    <rect x="650" y="175" width="28" height="60" fill="#15803D" rx="2" />
    <rect x="680" y="180" width="25" height="55" fill="#991B1B" rx="2" />
  </g>

  <!-- Reading Desk in Foreground -->
  <rect x="200" y="360" width="400" height="110" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" />
  <!-- Open Book on Table -->
  <g transform="translate(400, 390)">
    <path d="M 0 5 C -25 -5 -60 -5 -80 10 L -80 45 C -60 30 -25 30 0 40 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" />
    <path d="M 0 5 C 25 -5 60 -5 80 10 L 80 45 C 60 30 25 30 0 40 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" />
    <line x1="0" y1="5" x2="0" y2="40" stroke="#B45309" stroke-width="2" />
  </g>

  <!-- Banner Header -->
  <rect x="200" y="25" width="400" height="50" rx="10" fill="#FFFFFF" stroke="#166534" stroke-width="2" />
  <text x="400" y="47" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#166534" text-anchor="middle">LIBRARY &amp; FOUNDATIONAL READING CORNER</text>
  <text x="400" y="65" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">Cultivating Lifelong Curiosity, Literacy &amp; Research</text>

  <!-- Badge Overlay -->
  <rect x="30" y="30" width="130" height="36" rx="6" fill="#166534" />
  <text x="95" y="53" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CLASSROOM</text>
</svg>
