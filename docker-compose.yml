version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: madni_mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - madni_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: madni_server
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:3000
      - MONGO_URI=mongodb://mongodb:27017/madni_public_school
      - JWT_SECRET=MadniPublicSchoolSecureSecretKey2024!
      - JWT_EXPIRES_IN=7d
      - ADMIN_EMAIL=admin@madnipublicschool.edu.pk
      - ADMIN_PASSWORD=MadniAdmin2024!
      - ADMIN_NAME=Madni School Administration
      - STORAGE_PROVIDER=local
      - UPLOAD_DIR=uploads
    depends_on:
      - mongodb
    volumes:
      - server_uploads:/app/uploads
    networks:
      - madni_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: madni_client
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      - server
    networks:
      - madni_network

volumes:
  mongo_data:
  server_uploads:

networks:
  madni_network:
    driver: bridge
